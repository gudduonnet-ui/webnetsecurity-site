<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Projects — Webnet Security Solutions</title>
  <meta name="description" content="Projects — Webnet Security Solutions. CCTV installations & completed projects." />
  <link rel="icon" href="/favicon.ico">
  <style>/* styles omitted for brevity - same as earlier */</style>
</head>
<body>
  <div class="wrap">
    <header> <div class="brand"><img src="/logo.png" alt="logo"><div><h1>Webnet Security Solutions</h1><div style="color:#94a3b8;font-size:13px">CCTV • Installation • AMC — Call: 84449-80008</div></div></div>
      <nav><a href="/">Home</a><a href="/projects.html" class="cta">Projects</a><a href="/products.html">Products</a><a href="/admin/" style="margin-left:12px;border:1px solid rgba(255,255,255,0.04);padding:8px 10px;border-radius:6px">Admin</a></nav>
    </header>
    <section class="hero"><h2 style="margin:0 0 6px 0">Our Projects</h2><p style="margin:0;color:#94a3b8">Completed CCTV & security installations — managed via Netlify CMS. Add new projects from <strong>/admin/</strong></p></section>
    <section id="projectsSection"><div id="projectsGrid" class="grid"></div><div id="projectsEmpty" class="empty" style="display:none">No projects yet. Add from <a href="/admin/" style="color:#06b6d4">Admin</a>.</div></section>
    <footer>© <span id="year"></span> Webnet Security Solutions — Made with care</footer>
  </div>
<script>document.getElementById('year').textContent = new Date().getFullYear(); async function loadProjects(){try{const res=await fetch('/data/projects.json',{cache:'no-store'}); if(!res.ok) throw new Error('Status '+res.status); const json=await res.json(); const projects=Array.isArray(json.projects)?json.projects:[]; const grid=document.getElementById('projectsGrid'); const empty=document.getElementById('projectsEmpty'); if(projects.length===0){grid.style.display='none'; empty.style.display='block'; return;} empty.style.display='none'; grid.style.display='grid'; grid.innerHTML=projects.map(p=>{const img=(p.images&&p.images.length)?p.images[0]:'/hero.jpg'; const price=p.price?`<div class="price">${p.price}</div>`:''; return `<article class="card"><img src="${img}" alt="${p.title||'Project'}"><h3 style="margin:0 0 6px 0">${p.title||'Untitled'}</h3><div style="color:#94a3b8">${p.summary||''}</div>${price}<div class="meta">${p.category||''}</div></article>`}).join('');}catch(e){console.error('Load projects error',e); document.getElementById('projectsGrid').innerHTML='<div class="empty">Error loading projects.</div>'}} loadProjects(); function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script>
</body>
</html>
