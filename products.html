<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Products — Webnet Security Solutions</title><link rel="icon" href="/favicon.ico"></head><body><div class="wrap"><header><div class="brand"><img src="/logo.png" alt="logo"><div><h1 style="margin:0">Webnet Security Solutions</h1><div style="color:#94a3b8;font-size:13px">Products & Accessories</div></div></div><nav><a href="/">Home</a><a href="/projects.html">Projects</a><a href="/products.html" class="cta">Products</a><a href="/admin/" style="margin-left:12px;border:1px solid rgba(255,255,255,0.04);padding:8px 10px;border-radius:6px">Admin</a></nav></header><section class="hero" style="margin-bottom:18px;background:rgba(255,255,255,0.02);padding:14px;border-radius:8px"><h2 style="margin:0">Products</h2><p style="margin:6px 0 0 0;color:#94a3b8">Manage product catalog from the Admin panel.</p></section><section id="productsSection"><div id="productsGrid" class="grid"></div><div id="productsEmpty" class="empty" style="display:none">No products yet. Add from <a href="/admin/" style="color:#06b6d4">Admin</a>.</div></section><footer>© <span id="year"></span> Webnet Security Solutions</footer></div><script>document.getElementById('year').textContent=new Date().getFullYear(); async function loadProducts(){try{const res=await fetch('/data/products.json',{cache:'no-store'}); if(!res.ok) throw new Error('Status '+res.status); const json=await res.json(); const arr=Array.isArray(json.products)?json.products:[]; const grid=document.getElementById('productsGrid'); const empty=document.getElementById('productsEmpty'); if(arr.length===0){grid.style.display='none'; empty.style.display='block'; return} empty.style.display='none'; grid.style.display='grid'; grid.innerHTML=arr.map(p=>{const img=p.image||'/hero.jpg'; return `<article class="card"><img src="${img}" alt="${p.name||'Product'}"><h3 style="margin:0 0 6px 0">${p.name||'Unnamed'}</h3><div style="color:#94a3b8">${p.description||''}</div><div class="price" style="margin-top:8px">${p.price||'-'}</div></article>`}).join('')}catch(e){console.error('loadProducts err',e); document.getElementById('productsGrid').innerHTML='<div class="empty">Error loading products.</div>'}} loadProducts(); function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}</script></body></html>
