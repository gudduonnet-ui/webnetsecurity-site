<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Webnet Security Solutions</title>
    <meta name="description" content="Webnet Security Solutions — CCTV cameras, DVR/NVR, installation, AMC, live monitoring & support. Call 84449-80008." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="styles.css" />

    <!-- ✅ Netlify Identity widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- यहाँ आपकी existing site content होगा -->
      <h1>Welcome to Webnet Security Solutions</h1>
      <p>24×7 CCTV & Security for Home & Business</p>
    </div>

    <script src="site.js"></script>

    <!-- ✅ Auto-init script -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
